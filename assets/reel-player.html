<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zecheng Li — Research Reel</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#05060a;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;user-select:none}
  canvas{display:block;width:100%;height:100%;object-fit:contain}
  #overlay-play{position:absolute;inset:0 0 48px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(5,6,10,.28);transition:opacity .2s}
  #overlay-play.is-playing{opacity:0;pointer-events:none}
  .play-pill{display:flex;align-items:center;gap:10px;padding:13px 26px;border-radius:999px;background:rgba(15,23,42,.86);border:1.5px solid rgba(255,138,61,.75);color:#fff;font:650 16px/1 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.55);backdrop-filter:blur(8px)}
  .play-pill span.tri{color:#ff8a3d;font-size:18px}
  #controls{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(180deg,rgba(5,6,10,0),rgba(5,6,10,.92) 35%);display:flex;align-items:center;gap:10px;padding:0 14px;color:#e2e8f0;font:600 12px/1 Menlo,monospace}
  .ctrl-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:6px;height:28px;padding:0 10px;font:600 12px/1 system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .ctrl-btn:hover{border-color:#ff8a3d;background:rgba(255,138,61,.18)}
  #scrub-wrap{flex:1;height:20px;display:flex;align-items:center;cursor:pointer;position:relative}
  #scrub-track{width:100%;height:5px;background:rgba(255,255,255,.18);border-radius:999px;position:relative;overflow:hidden}
  #scrub-fill{height:100%;width:0%;background:linear-gradient(90deg,#7a2ea0,#ff8a3d,#ffe39a);border-radius:999px}
  #time-label{min-width:84px;text-align:right;color:#cbd5e1;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="overlay-play" title="点击播放 / 暂停">
  <div class="play-pill"><span class="tri">▶</span><span>点击播放 80 秒个人学术短片 (含配乐)</span></div>
</div>
<div id="controls">
  <button type="button" class="ctrl-btn" id="btn-toggle">▶ 播放</button>
  <div id="scrub-wrap" title="拖动或点击跳转进度">
    <div id="scrub-track"><div id="scrub-fill"></div></div>
  </div>
  <span id="time-label">00:00 / 01:20</span>
  <button type="button" class="ctrl-btn" id="btn-mute">🔊 配乐</button>
  <button type="button" class="ctrl-btn" id="btn-fs" title="全屏播放">⛶</button>
</div>
<script src="dots.js"></script>
<script>
// =====================================================================
//  ZECHENG LI — research reel.  80 s, 96 BPM (bar = 2.5 s).
//  renderAt(t) is a pure function of time: no Math.random, no clock,
//  no carried state.  ?t=12.3 freezes a moment; ?capture=1 for export.
// =====================================================================
const W = 1920, H = 1080, DUR = 80;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SANS = 'system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
const MONO = 'Menlo, "SF Mono", Monaco, monospace';
const INK = '#eef1f7', MUTED = '#8f98ab', DIM = '#5b6274';
const ORANGE = '#ff8a3d', AMBER = '#fcb33a', CYAN = '#56d4ea', RED = '#ff4f45';

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOutC = x => 1 - Math.pow(1 - x, 3);
const eInOutC = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInOutS = x => x * x * (3 - 2 * x);
function spring(x, zeta = 0.72, settle = 0.35) {      // closed-form step response
  if (x <= 0) return 0;
  const wn = 4 / (zeta * settle);
  if (zeta < 1) {
    const wd = wn * Math.sqrt(1 - zeta * zeta);
    return 1 - Math.exp(-zeta * wn * x) * (Math.cos(wd * x) + zeta * wn / wd * Math.sin(wd * x));
  }
  return 1 - Math.exp(-wn * x) * (1 + wn * x);
}
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function hash2(a, b) { return hash(a * 57.0 + b * 113.0 + 0.5); }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = eInOutS(xf), v = eInOutS(yf), w = eInOutS(zf);
  const h = (i, j, k) => hash(i * 157 + j * 113 + k * 271);
  const a = lerp(lerp(h(xi, yi, zi), h(xi + 1, yi, zi), u), lerp(h(xi, yi + 1, zi), h(xi + 1, yi + 1, zi), u), v);
  const b = lerp(lerp(h(xi, yi, zi + 1), h(xi + 1, yi, zi + 1), u), lerp(h(xi, yi + 1, zi + 1), h(xi + 1, yi + 1, zi + 1), u), v);
  return lerp(a, b, w);
}
function fbm(x, y, z) { return vnoise(x, y, z) * .55 + vnoise(x * 2.1, y * 2.1, z * 1.3) * .3 + vnoise(x * 4.3, y * 4.3, z * 1.7) * .15; }

// ---------- colour ----------
const INFERNO = [[0, 0, 4], [40, 11, 84], [101, 21, 110], [159, 42, 99], [212, 72, 66], [245, 125, 21], [250, 193, 39], [252, 255, 164]];
function cmap(stops, v) {
  v = clamp(v) * (stops.length - 1); const i = Math.min(stops.length - 2, Math.floor(v)), f = v - i;
  const a = stops[i], b = stops[i + 1];
  return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), lerp(a[2], b[2], f)];
}
const inferno = v => cmap(INFERNO, v);
const STRIPES = [[8, 48, 107], [33, 102, 172], [67, 147, 195], [146, 197, 222], [247, 247, 247], [244, 165, 130], [214, 96, 77], [178, 24, 43], [103, 0, 13]];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ---------- drawing helpers ----------
function font(size, weight = 500, fam = SANS) { return `${weight} ${size}px ${fam}`; }
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.font = font(o.size || 32, o.weight || 500, o.mono ? MONO : SANS);
  ctx.fillStyle = o.color || INK;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  if (o.blur > 0.3) ctx.filter = `blur(${o.blur.toFixed(1)}px)`;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function measure(s, size, weight = 500, mono = false, ls = 0) {
  ctx.save(); ctx.font = font(size, weight, mono ? MONO : SANS); ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
function wrap(s, maxW, size, weight = 500) {
  const words = s.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const tst = cur ? cur + ' ' + w : w;
    if (measure(tst, size, weight) > maxW && cur) { lines.push(cur); cur = w; } else cur = tst;
  }
  if (cur) lines.push(cur); return lines;
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// reveal: blur-in + rise; returns k in 0..1
function rv(lt, start, dur = 0.5) { return eOutC(P(lt, start, start + dur)); }
function layer(alpha, blur, fn, dx = 0, dy = 0, sc = 1, cx = W / 2, cy = H / 2) {
  if (alpha <= 0.004) return;
  ctx.save();
  ctx.globalAlpha *= clamp(alpha);
  if (blur > 0.3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
  if (sc !== 1 || dx || dy) { ctx.translate(cx + dx, cy + dy); ctx.scale(sc, sc); ctx.translate(-cx, -cy); }
  fn(); ctx.restore();
}
function chip(label, x, y, o = {}) {      // pill centred on x if o.center
  const size = o.size || 24, padX = o.padX || 22, h = o.h || size * 1.9;
  const w = measure(label, size, o.weight || 600, o.mono, o.ls || 0) + padX * 2;
  const x0 = o.center ? x - w / 2 : x;
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  rrect(x0, y - h / 2, w, h, h / 2);
  ctx.fillStyle = o.fill || 'rgba(255,255,255,0.05)'; ctx.fill();
  ctx.lineWidth = o.lw || 1.5; ctx.strokeStyle = o.stroke || 'rgba(255,255,255,0.25)'; ctx.stroke();
  ctx.font = font(size, o.weight || 600, o.mono ? MONO : SANS); ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.fillStyle = o.color || INK; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText(label, x0 + padX, y + 1);
  ctx.restore();
  return w;
}
function glowDot(x, y, r, col, a = 1) {
  ctx.save(); ctx.globalAlpha *= a;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
  g.addColorStop(0, col); g.addColorStop(0.25, col.replace(/[\d.]+\)$/, '0.35)')); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, 7); ctx.fill();
  ctx.restore();
}
function sceneHeader(lt, idx, title, sub, badge) {
  const k1 = rv(lt, 0.0, 0.5), k2 = rv(lt, 0.15, 0.55), k3 = rv(lt, 0.3, 0.55), k4 = spring(lt - 0.5, 0.65, 0.5);
  text(idx, 110, 170, { size: 22, weight: 600, mono: true, color: ORANGE, ls: 4, alpha: k1, blur: (1 - k1) * 10 });
  text(title, 110 + (1 - k2) * -30, 240, { size: 62, weight: 750, alpha: k2, blur: (1 - k2) * 12, ls: -1 });
  text(sub, 110, 290, { size: 27, weight: 450, color: MUTED, alpha: k3, blur: (1 - k3) * 10 });
  if (badge) {
    const w = measure(badge, 22, 650) + 70;
    layer(clamp(k4 * 1.4), 0, () => {
      chip(badge, 1810 - w, 175, { size: 22, weight: 650, stroke: 'rgba(255,138,61,0.75)', fill: 'rgba(255,138,61,0.10)', color: '#ffd2b0', padX: 35 });
    }, 0, 0, 0.6 + 0.4 * k4, 1810 - w / 2, 175);
  }
}

// ---------- persistent background ----------
const fieldC = document.createElement('canvas'); fieldC.width = 128; fieldC.height = 72;
const fctx = fieldC.getContext('2d'); const fimg = fctx.createImageData(128, 72);
const grainC = document.createElement('canvas'); grainC.width = 256; grainC.height = 256;
(() => { const g = grainC.getContext('2d'), im = g.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) { const v = hash(i * 0.731 + 3.1) * 255; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); })();

function heatLevel(t) {         // how "hot" the ambient field is
  if (t < 7.5) return lerp(0.25, 0.95, eInOutC(P(t, 0, 6.8)));
  if (t < 15) return lerp(0.95, 0.35, eOutC(P(t, 7.5, 9)));
  if (t < 27.5) return lerp(0.3, 0.55, P(t, 25, 27.5));
  if (t < 37.5) return 0.5;
  if (t < 47.5) return lerp(0.5, 0.7, P(t, 41, 46));
  if (t < 67.5) return 0.38;
  if (t < 72.5) return lerp(0.45, 0.65, P(t, 67.5, 71.5));
  if (t < 75.0) return lerp(0.65, 0.52, P(t, 72.5, 75.0));
  return lerp(0.52, 0.36, P(t, 75.0, 80.0));
}
function background(t) {
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  const lvl = heatLevel(t), d = fimg.data;
  for (let y = 0; y < 72; y++) for (let x = 0; x < 128; x++) {
    let n = fbm(x * 0.045 + t * 0.03, y * 0.06 - t * 0.05, t * 0.12);
    n = clamp((n - 0.28) * 1.6) * lvl * (0.55 + 0.45 * (y / 72));
    const c = inferno(n * 0.85), i = (y * 128 + x) * 4;
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  fctx.putImageData(fimg, 0, 0);
  ctx.save(); ctx.globalAlpha = 0.42; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(fieldC, 0, 0, W, H); ctx.restore();
  // fine grid
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.025)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= W; x += 60) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
  for (let y = 0; y <= H; y += 60) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke(); ctx.restore();
}
function postFX(t) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const f = Math.floor(t * 30);
  ctx.save(); ctx.globalAlpha = 0.045; ctx.globalCompositeOperation = 'overlay';
  const ox = Math.floor(hash(f) * 256), oy = Math.floor(hash(f + 99) * 256);
  for (let x = -ox; x < W; x += 256) for (let y = -oy; y < H; y += 256) ctx.drawImage(grainC, x, y);
  ctx.restore();
}

// ---------- HUD ----------
const CUTS = [0, 7.5, 15, 27.5, 37.5, 47.5, 57.5, 67.5, 80];
const SECTIONS = ['PROLOGUE', 'IDENTITY', 'JOURNEY', 'RESEARCH · VULNERABILITY', 'RESEARCH · EARLY WARNING', 'PUBLICATIONS', 'SERVICE & TOOLKIT', 'IMPACT & CONTACT'];
function sceneIndex(t) { for (let i = CUTS.length - 2; i >= 0; i--) if (t >= CUTS[i]) return i; return 0; }
function hud(t) {
  const a = P(t, 7.6, 8.4); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = eOutC(a);
  rrect(110, 52, 44, 44, 8); ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  text('ZL', 132, 81, { size: 18, weight: 700, mono: true, align: 'center' });
  text('DR. ZECHENG LI', 172, 74, { size: 16, weight: 650, ls: 4 });
  text('RESEARCH REEL · 2026', 172, 94, { size: 13, weight: 500, mono: true, color: DIM, ls: 2 });
  // section label with vertical roll swap
  const si = sceneIndex(t), lt = t - CUTS[si];
  const k = spring(lt, 0.8, 0.5);
  ctx.save(); ctx.beginPath(); ctx.rect(1000, 50, 812, 50); ctx.clip();
  const lab = (i) => `${String(i + 1).padStart(2, '0')} / 08 — ${SECTIONS[i]}`;
  text(lab(si), 1810, 82 + (1 - k) * 34, { size: 16, weight: 600, mono: true, align: 'right', ls: 2, color: '#cfd5e2' });
  if (si > 1 && k < 1) text(lab(si - 1), 1810, 82 - k * 34, { size: 16, weight: 600, mono: true, align: 'right', ls: 2, color: '#cfd5e2' });
  ctx.restore();
  // progress
  const y = 1030, x0 = 110, x1 = 1810;
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x0, y, x1 - x0, 2);
  const gr = ctx.createLinearGradient(x0, 0, x1, 0); gr.addColorStop(0, '#7a2ea0'); gr.addColorStop(0.5, ORANGE); gr.addColorStop(1, '#ffe39a');
  ctx.fillStyle = gr; ctx.fillRect(x0, y, (x1 - x0) * clamp(t / DUR), 2);
  for (let i = 1; i < CUTS.length - 1; i++) { const x = x0 + (x1 - x0) * CUTS[i] / DUR; ctx.fillStyle = t >= CUTS[i] ? '#ffd2b0' : 'rgba(255,255,255,0.3)'; ctx.fillRect(x - 1, y - 4, 2, 10); }
  ctx.restore();
}
function cutFlash(t) {
  for (let i = 1; i < CUTS.length - 1; i++) {
    const d = t - CUTS[i];
    if (d >= 0 && d < 0.35) { ctx.save(); ctx.globalAlpha = 0.10 * (1 - d / 0.35); ctx.fillStyle = '#ffe2c4'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  }
}

// =====================================================================
// SCENE 1 — PROLOGUE (0 – 7.5)
// =====================================================================
const TYPE1 = 'The planet is getting hotter.', TYPE2 = 'Who is most at risk  —  and when?', CPS = 0.045;
function typed(s, t0, lt) { return s.slice(0, clamp(Math.floor((lt - t0) / CPS) + 1, 0, s.length)); }
function scene1(lt) {
  const N = 72, sw = W / N;
  const squash = eInOutC(P(lt, 5.9, 7.1));
  const sh = lerp(H, 6, squash);
  for (let i = 0; i < N; i++) {
    const appear = eOutC(P(lt, 0.15 + i * 0.022, 0.75 + i * 0.022));
    if (appear <= 0) continue;
    const v = clamp(0.06 + 0.86 * Math.pow(i / (N - 1), 1.9) + 0.18 * (hash(i * 3.3) - 0.5));
    const c = cmap(STRIPES, v);
    const h = sh * appear;
    ctx.fillStyle = rgb(c, 0.62 + squash * 0.38);
    ctx.fillRect(Math.floor(i * sw), H / 2 - h / 2, Math.ceil(sw) + 1, h);
  }
  if (squash > 0.6) {   // glowing line
    const g = (squash - 0.6) / 0.4;
    ctx.save(); ctx.globalAlpha = g; ctx.shadowColor = ORANGE; ctx.shadowBlur = 40; ctx.fillStyle = '#ffd9b5';
    ctx.fillRect(0, H / 2 - 1.5, W, 3); ctx.restore();
  }
  // darken for legibility
  const dg = ctx.createLinearGradient(0, 0, W, 0);
  dg.addColorStop(0, 'rgba(5,6,10,0.88)'); dg.addColorStop(0.62, 'rgba(5,6,10,0.55)'); dg.addColorStop(1, 'rgba(5,6,10,0.15)');
  ctx.fillStyle = dg; ctx.globalAlpha = 1 - squash; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;

  const out = P(lt, 5.7, 6.4);
  layer(1 - out, out * 16, () => {
    const s1 = typed(TYPE1, 0.9, lt), s2 = typed(TYPE2, 3.6, lt);
    const sz = 84, x = 150, y1 = 470, y2 = 590;
    if (lt >= 0.9) {
      text(s1, x, y1, { size: sz, weight: 650, ls: -1.5 });
      if (s1.length === TYPE1.length) {           // recolour "hotter."
        const pre = measure('The planet is getting ', sz, 650, false, -1.5);
        const k = P(lt, 2.3, 2.9);
        text('hotter.', x + pre, y1, { size: sz, weight: 650, ls: -1.5, color: ORANGE, alpha: k });
      }
    }
    if (lt >= 3.6) {
      text(s2, x, y2, { size: sz, weight: 650, ls: -1.5, color: '#d9dee8' });
      if (s2.length === TYPE2.length) {
        const pre = measure('Who is most at risk  —  ', sz, 650, false, -1.5);
        text('and when?', x + pre, y2, { size: sz, weight: 650, ls: -1.5, color: AMBER, alpha: P(lt, 5.15, 5.6) });
      }
    }
    // caret
    const active = lt < 3.6 ? [s1, y1, TYPE1] : [s2, y2, TYPE2];
    const blink = (Math.floor(lt / 0.32) % 2 === 0) || (active[0].length < active[2].length);
    if (lt > 0.4 && blink) {
      const cx = x + measure(active[0], sz, 650, false, -1.5) + 8;
      ctx.fillStyle = ORANGE; ctx.fillRect(cx, active[1] - 66, 6, 80);
    }
  });
  // boot line
  const pct = Math.floor(100 * eInOutC(P(lt, 0.2, 7.2)));
  const ba = P(lt, 0.2, 0.8) * (1 - P(lt, 7.0, 7.4));
  text(`> loading  dr_zecheng_li.cv  ·  ${String(pct).padStart(3, ' ')}%`, 150, 980, { size: 20, mono: true, color: MUTED, alpha: ba, ls: 1 });
  ctx.save(); ctx.globalAlpha = ba; ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(150, 1000, 520, 3);
  ctx.fillStyle = ORANGE; ctx.fillRect(150, 1000, 520 * pct / 100, 3); ctx.restore();
}

// =====================================================================
// SCENE 2 — IDENTITY (7.5 – 15)
// =====================================================================
function scene2(lt) {
  const cx = W / 2;
  // ripple + burst
  const rp = P(lt, 0, 1.3);
  if (rp > 0 && rp < 1) {
    ctx.save(); ctx.strokeStyle = `rgba(255,170,110,${0.7 * (1 - rp)})`; ctx.lineWidth = 3 + 10 * (1 - rp);
    ctx.beginPath(); ctx.arc(cx, 540, eOutExpo(rp) * 1300, 0, 7); ctx.stroke(); ctx.restore();
  }
  for (let i = 0; i < 160; i++) {
    const life = P(lt, 0, 1.4 + hash(i) * 1.2); if (life >= 1) continue;
    const ang = hash(i * 1.7) * Math.PI * 2, dist = (200 + hash(i * 2.9) * 900) * eOutExpo(life);
    const c = inferno(0.55 + hash(i * 5.1) * 0.45);
    ctx.fillStyle = rgb(c, (1 - life) * 0.9);
    const r = 1.5 + hash(i * 7.7) * 3;

      // 1. Eyebrow
      const kEye = rv(tC, 0.20, 0.45);
      text('CLIMATE RISK  ·  INTERPRETABLE AI  ·  OPEN TO COLLABORATION', cx, 285, { size: 17, mono: true, weight: 600, color: ORANGE, ls: 4, align: 'center', alpha: kEye, blur: (1 - kEye) * 8 });

      // 2. Monumental Name
      const kName = spring(tC - 0.10, 0.72, 0.6), aName = clamp(kName * 1.5);
      ctx.save();
      ctx.globalAlpha *= aName;
      if (aName < 0.98) ctx.filter = `blur(${((1 - aName) * 12).toFixed(1)}px)`;
      const ng = ctx.createLinearGradient(0, 325, 0, 420);
      ng.addColorStop(0, '#ffffff'); ng.addColorStop(1, '#ffd9ba');
      ctx.font = font(114, 800); ctx.fillStyle = ng; ctx.textAlign = 'center'; ctx.letterSpacing = '11px';
      ctx.fillText('DR. ZECHENG LI', cx, 415 + (1 - kName) * 28);
      ctx.restore();

      // 3. Bookend 72-Segment Warming-Stripe Bar + Specular Sweep
      const u = eInOutC(P(tC, 0.35, 1.05));
      if (u > 0) {
        const bw = 780, bx0 = cx - bw / 2, by = 452, bh = 5, N = 72, sw = bw / N;
        const half = (bw / 2) * u, vis0 = cx - half, vis1 = cx + half;
        const sweepX = bx0 - 120 + P(tC, 1.5, 4.3) * (bw + 240);
        for (let i = 0; i < N; i++) {
          const x0 = bx0 + i * sw, x1 = x0 + sw + 0.6;
          if (x1 < vis0 || x0 > vis1) continue;
          const vx0 = Math.max(x0, vis0), vx1 = Math.min(x1, vis1);
          const v = clamp(0.06 + 0.86 * Math.pow(i / (N - 1), 1.9) + 0.18 * (hash(i * 3.3) - 0.5));
          const distSweep = Math.abs((x0 + sw * 0.5) - sweepX);
          const spec = clamp(1 - distSweep / 70);
          const baseC = cmap(STRIPES, v);
          const col = spec > 0 && tC >= 1.5 && tC <= 4.3 ? [lerp(baseC[0], 255, spec * 0.7), lerp(baseC[1], 242, spec * 0.7), lerp(baseC[2], 210, spec * 0.7)] : baseC;
          ctx.fillStyle = rgb(col, 0.95);
          ctx.fillRect(vx0, by, vx1 - vx0, bh);
        }
      }

      // 4. Credential Line
      const kCred = rv(tC, 0.55, 0.55);
      text('Ph.D. in Environmental Protection  ·  Universiti Malaya', cx, 516, { size: 30, weight: 550, align: 'center', color: '#e6eaf2', alpha: kCred, blur: (1 - kCred) * 10 });

      // 5. Proof Ribbon
      const kProof = rv(tC, 0.80, 0.55);
      text('10 PUBLICATIONS (7 JCR Q1 · 6 FIRST-AUTHOR)   ·   IPCC AR7 EXPERT REVIEWER   ·   USYD & UM', cx, 568, { size: 16, mono: true, weight: 600, align: 'center', color: MUTED, ls: 2, alpha: kProof });

      // 6. Hairline Divider
      ctx.save(); ctx.globalAlpha *= kProof;
      ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fillRect(640, 608, 640, 1);
      ctx.restore();

      // 7. Primary Email Pill with subtle breathing multi-stroke glow (fast, zero shadowBlur stall)
      const kMail = rv(tC, 1.05, 0.55);
      if (kMail > 0) {
        const pulse = 0.5 + 0.5 * Math.sin(tC * 2.4);
        layer(kMail, (1 - kMail) * 8, () => {
          const emailLabel = '✉  lizecheng3590@gmail.com';
          const ew = measure(emailLabel, 25, 650, true, 0) + 68, eh = 58;
          ctx.save();
          rrect(cx - ew / 2 - 8, 682 - eh / 2 - 8, ew + 16, eh + 16, (eh + 16) / 2);
          ctx.strokeStyle = `rgba(255,138,61,${0.08 + 0.08 * pulse})`; ctx.lineWidth = 8; ctx.stroke();
          rrect(cx - ew / 2 - 3, 682 - eh / 2 - 3, ew + 6, eh + 6, (eh + 6) / 2);
          ctx.strokeStyle = `rgba(255,138,61,${0.16 + 0.14 * pulse})`; ctx.lineWidth = 4; ctx.stroke();
          ctx.restore();
          chip(emailLabel, cx, 682, { center: true, size: 25, mono: true, weight: 650, h: eh, padX: 34, stroke: `rgba(255,138,61,${0.78 + 0.2 * pulse})`, fill: 'rgba(255,138,61,0.12)' });
        }, 0, (1 - kMail) * 18);
      }

      // 8. Links Row with colored accent dots
      const links = [['Google Scholar', CYAN], ['ORCID 0009-0002-7197-6679', ORANGE], ['LinkedIn', AMBER]];
      const chipSize = 19, padL = 38, padR = 22, gap = 20;
      const lw = links.map(([l]) => measure(l, chipSize, 600, true) + padL + padR);
      const tot = lw.reduce((a, b) => a + b, 0) + gap * 2;
      let xx = cx - tot / 2;
      links.forEach(([l, dotCol], i) => {
        const s = spring(tC - 1.35 - i * 0.12, 0.6, 0.45);
        if (s > 0) {
          const w = lw[i], h = 40, y = 772;
          layer(clamp(s * 1.5), 0, () => {
            ctx.save();
            rrect(xx, y - h / 2, w, h, h / 2);
            ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill();
            ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.stroke();
            ctx.fillStyle = dotCol;
            ctx.beginPath(); ctx.arc(xx + 20, y, 4.2, 0, Math.PI * 2); ctx.fill();
            ctx.font = font(chipSize, 600, MONO);
            ctx.fillStyle = INK; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
            ctx.fillText(l, xx + padL, y + 1);
            ctx.restore();
          }, 0, (1 - s) * 20, 1, xx + w / 2, y);
        }
        xx += lw[i] + gap;
      });
    }, 0, 0, 0.94 + 0.06 * kCard, cx, cy);

    // Bottom location footer outside card
    const kLoc = rv(tC, 1.65, 0.55);
    text('WUHAN, CHINA   ·   KUALA LUMPUR, MALAYSIA', cx, 928, { size: 17, mono: true, color: DIM, align: 'center', ls: 3, alpha: kLoc });
  }
}

// =====================================================================
const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6, scene7, scene8];
window.renderAt = function (t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  background(t);
  const si = sceneIndex(t);
  SCENES[si](t - CUTS[si]);
  hud(t);
  cutFlash(t);
  postFX(t);
};

// ---------- runtime ----------
const qs = new URLSearchParams(location.search);
if (qs.has('t')) {
  document.fonts.ready.then(() => renderAt(parseFloat(qs.get('t'))));
} else if (!qs.has('capture')) {
  const overlay = document.getElementById('overlay-play');
  const btnToggle = document.getElementById('btn-toggle');
  const btnMute = document.getElementById('btn-mute');
  const btnFs = document.getElementById('btn-fs');
  const scrubWrap = document.getElementById('scrub-wrap');
  const scrubFill = document.getElementById('scrub-fill');
  const timeLabel = document.getElementById('time-label');

  const audio = new Audio('/assets/bgm.m4a');
  audio.preload = 'auto';
  let playing = false;
  let muted = false;
  let currentT = 11.5; // Attractive default poster frame showing Dr. Zecheng Li identity card
  let lastWall = 0;

  function fmt(sec) {
    const s = Math.max(0, Math.floor(sec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
  }

  function updateUI(t) {
    scrubFill.style.width = `${clamp(t / DUR, 0, 1) * 100}%`;
    timeLabel.textContent = `${fmt(t)} / 01:20`;
    btnToggle.textContent = playing ? '⏸ 暂停' : '▶ 播放';
    overlay.classList.toggle('is-playing', playing);
    try {
      window.parent.postMessage({ type: 'reel-timeupdate', time: t }, '*');
    } catch {}
  }

  function syncAudioTo(t) {
    if (!muted && audio.readyState >= 1) {
      try {
        if (Math.abs(audio.currentTime - t) > 0.35) {
          audio.currentTime = t;
        }
      } catch {}
    }
  }

  function startPlay(fromTime) {
    if (typeof fromTime === 'number') {
      currentT = clamp(fromTime, 0, DUR - 0.05);
    } else if (currentT >= DUR - 0.1 || currentT === 11.5) {
      currentT = 0;
    }
    playing = true;
    lastWall = performance.now();
    if (!muted) {
      try {
        audio.currentTime = currentT;
        audio.play().catch(() => {});
      } catch {}
    }
    updateUI(currentT);
  }

  function pausePlay() {
    playing = false;
    try { audio.pause(); } catch {}
    updateUI(currentT);
  }

  function seekTo(sec, autoPlay = true) {
    currentT = clamp(sec, 0, DUR - 0.01);
    renderAt(currentT);
    syncAudioTo(currentT);
    if (autoPlay && !playing) {
      startPlay(currentT);
    } else {
      updateUI(currentT);
    }
  }

  function tick(now) {
    if (playing) {
      const dt = Math.min(0.1, (now - lastWall) / 1000);
      lastWall = now;
      if (!muted && !audio.paused && audio.readyState >= 2) {
        currentT = audio.currentTime;
      } else {
        currentT += dt;
      }
      if (currentT >= DUR) {
        currentT = DUR - 0.001;
        renderAt(currentT);
        pausePlay();
      } else {
        renderAt(currentT);
        updateUI(currentT);
      }
    }
    requestAnimationFrame(tick);
  }

  overlay.addEventListener('click', () => (playing ? pausePlay() : startPlay()));
  cv.addEventListener('click', () => (playing ? pausePlay() : startPlay()));
  btnToggle.addEventListener('click', () => (playing ? pausePlay() : startPlay()));

  btnMute.addEventListener('click', () => {
    muted = !muted;
    audio.muted = muted;
    btnMute.textContent = muted ? '🔇 静音' : '🔊 配乐';
    if (!muted && playing) {
      try {
        audio.currentTime = currentT;
        audio.play().catch(() => {});
      } catch {}
    }
  });

  btnFs.addEventListener('click', () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
    }
  });

  let dragging = false;
  function scrubFromEvent(e) {
    const rect = scrubWrap.getBoundingClientRect();
    const ratio = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    seekTo(ratio * DUR, playing);
  }
  scrubWrap.addEventListener('pointerdown', e => {
    dragging = true;
    scrubWrap.setPointerCapture(e.pointerId);
    scrubFromEvent(e);
  });
  scrubWrap.addEventListener('pointermove', e => {
    if (dragging) scrubFromEvent(e);
  });
  scrubWrap.addEventListener('pointerup', () => { dragging = false; });

  window.addEventListener('message', event => {
    const data = event.data;
    if (data && data.type === 'reel-seek') {
      seekTo(Number(data.time || 0), true);
    }
  });

  document.fonts.ready.then(() => {
    renderAt(currentT);
    updateUI(currentT);
    requestAnimationFrame(tick);
  });
}
window.READY = document.fonts.ready.then(() => true);
</script>
